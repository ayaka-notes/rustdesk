name: Portal — build & publish

# Single pipeline for the download portal (portal/). Two deploy targets,
# built in parallel from the same source:
#   - docker      -> ghcr.io/<owner>/rustdesk-portal   (self-host, base "/")
#   - pages-build -> GitHub Pages artifact             (base "/rustdesk/")
#   - pages-deploy-> https://<owner>.github.io/rustdesk/
#
# Path-filtered to portal/** so it never fires for RustDesk client source.

on:
  push:
    branches: ['ayaka-v*']
    paths:
      - 'portal/**'
      - '.github/workflows/portal.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/rustdesk-portal

jobs:
  # ---- Docker image -> GHCR (served at root "/") ----
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ./portal
          file: ./portal/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=portal
          cache-to: type=gha,scope=portal,mode=max
          # Suppress SBOM/provenance attestations — they add bogus
          # "unknown/unknown" manifest entries on the GHCR package page.
          provenance: false
          sbom: false

  # ---- Static build -> GitHub Pages artifact (subpath "/rustdesk/") ----
  pages-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build (base=/rustdesk/ for the project page subpath)
        run: npm run build
        env:
          PORTAL_BASE: /rustdesk/

      - name: Configure Pages
        # enablement: true turns Pages on for the repo if it isn't already,
        # so the first run needs no manual Settings -> Pages toggle.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist

  # ---- Deploy the artifact to GitHub Pages ----
  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One Pages deploy at a time; a newer push supersedes an in-flight one.
    concurrency:
      group: portal-pages
      cancel-in-progress: true
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
