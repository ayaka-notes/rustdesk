# Single nginx serving the SPA + /downloads/ for installer files.
# /downloads/ is a mounted volume so operators drop new installers without
# rebuilding the image.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Large downloads — disable buffering, allow ranges, sane timeouts.
    client_max_body_size 0;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;

    # SPA root.
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed Vite assets.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static logo / favicon never change between builds.
    location = /logo.svg {
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # Installer artifacts — served from a mounted volume.
    location /downloads/ {
        alias /srv/downloads/;
        autoindex off;
        # Force download instead of inline preview for any binary type.
        add_header Content-Disposition 'attachment';
        # Allow resume on large dmg/apk/AppImage.
        add_header Accept-Ranges bytes;
        # Friendlier 404 page would be nice but the SPA fallback below already
        # catches missing assets — explicit 404 here so a 404 doesn't render
        # the SPA at /downloads/foo.deb.
        try_files $uri =404;
    }

    # Optional: operator-supplied releases.json overrides the bundled manifest.
    location = /releases.json {
        alias /srv/downloads/releases.json;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — every other path serves index.html so React Router (if
    # added later) doesn't 404 on deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
